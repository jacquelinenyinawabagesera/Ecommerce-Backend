{% extends "base.html" %}
{% block content %}
<div class="py-14 bg-gray-50">
  <div class="max-w-7xl mx-auto px-6">
    <h1 class="text-4xl font-extrabold text-green-700 text-center mb-16 tracking-wider uppercase drop-shadow-sm">Fresh Picks for You</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-10">
      {% for product in products %}
      <div class="bg-white rounded-3xl shadow-md p-6 transform transition duration-300 hover:scale-105 hover:shadow-lg">
        <a href="{% url 'product_details' product.id %}" class="flex flex-col items-center">
          {% if product.image %}
            <img src="{{ product.image }}" alt="{{ product.name }}"
                 class="w-44 h-44 object-contain rounded-2xl mb-5  border-green-200"/>
          {% else %}
            <div class="w-44 h-44 flex items-center justify-center rounded-2xl border-2 border-green-300 mb-5 bg-green-50 text-green-300 font-semibold">
              No Image
            </div>
          {% endif %}
          <span class="text-green-600 font-semibold text-sm uppercase">{{ product.category }}</span>
          <h2 class="text-xl font-bold text-green-800 mt-2 mb-3 text-center truncate">{{ product.name }}</h2>
        </a>
        <a href="{% url 'product_details' product.id %}" 
           class="block text-center px-5 py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-full shadow transition">
          More Info
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}

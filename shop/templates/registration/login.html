{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jacky Grocery Shop - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .float-up {
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-tr from-green-900 via-green-700 to-green-800 flex items-center justify-center px-6">
  <div class="relative max-w-lg w-full bg-white bg-opacity-90 rounded-3xl shadow-xl p-12 overflow-hidden"
       style="backdrop-filter: blur(8px);">


    <svg class="absolute top-4 left-[-40px] w-40 h-40 float-up text-green-400 opacity-40" fill="currentColor" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 0C21 6 9 18 9 30s14 19 23 24c4 2 14 4 19-2s-4-21-11-33-8-19-8-19z"/>
    </svg>
    <svg class="absolute bottom-4 right-[-40px] w-40 h-40 float-up text-green-300 opacity-30" fill="currentColor" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="32" cy="32" r="30"/>
    </svg>


    <h1 class="text-5xl font-extrabold text-green-900 mb-8 text-center tracking-wide">Welcome Back</h1>


    <form method="post" class="space-y-8">
      {% csrf_token %}


      <div>
        <label for="id_username" class="block text-green-900 font-semibold mb-3 text-lg">Username</label>
        <input type="text" name="username" id="id_username" required
          class="w-full px-6 py-4 rounded-xl border border-green-400 focus:outline-none focus:ring-6 focus:ring-green-500 transition text-lg" />
      </div>


      <div>
        <label for="id_password" class="block text-green-900 font-semibold mb-3 text-lg">Password</label>
        <input type="password" name="password" id="id_password" required
          class="w-full px-6 py-4 rounded-xl border border-green-400 focus:outline-none focus:ring-6 focus:ring-green-500 transition text-lg" />
      </div>


      <div class="flex items-center justify-between text-green-700 text-base">
        <label class="flex items-center space-x-4">
          <input type="checkbox" name="remember_me" class="accent-green-600 w-5 h-5"/>
          <span>Keep me logged in</span>
        </label>
        <a href="#" class="font-semibold hover:underline hover:text-green-900 transition text-base">Forgot password?</a>
      </div>


      <button type="submit"
        class="w-full py-4 bg-green-700 hover:bg-green-800 text-white font-bold rounded-3xl shadow-lg text-xl transition">
        Log In
      </button>
    </form>


    {% if form.errors %}
      <div class="mt-6 text-red-600 text-center font-semibold text-lg">
        {% for error in form.non_field_errors %}
          <p>{{ error }}</p>
        {% endfor %}
      </div>
    {% endif %}


    <p class="mt-10 text-center text-green-900 font-medium text-lg">
      New here? <a href="#" class="text-green-700 font-bold hover:underline">Sign up</a>
    </p>
  </div>
</body>
</html>
